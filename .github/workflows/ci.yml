name: CI

on:
  push:
    branches: [main, master, rebuild]
  pull_request:
  # Weekly re-scan: catches vulnerabilities announced since the last change.
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core (Python) tests and security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    env:
      AIPAYGEN_IP_HASH_SECRET: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11.17"
      - name: Install exact dependencies
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -r requirements.lock
      - name: Known vulnerabilities (pip-audit)
        run: uvx pip-audit -r requirements.lock --progress-spinner off
      - name: Security scan (Bandit, high severity)
        run: uvx bandit -r . -x ./.venv,./tests,./sdk,./examples,./products -lll -q
      - name: Crash-class lint (undefined names, duplicate definitions)
        run: uvx ruff check . --exclude .venv,tests --select F821,F822,F823
      - name: Tests
        # The 5 known baseline failures are listed in REBUILD_PLAN.md; they are
        # deselected so any new failure turns CI red.
        run: >
          .venv/bin/python -m pytest tests/ -q -p no:cacheprovider -o addopts=""
          --deselect tests/test_discovery_api.py::test_wallet_analytics_unknown_wallet
          --deselect tests/test_sse_negotiation.py::TestResearchSSE::test_no_sse_header_returns_json
          --deselect tests/test_sse_negotiation.py::TestWriteSSE::test_no_sse_header_returns_json
          --deselect tests/test_v2_integration.py::test_buy_credits_default
          --deselect tests/test_v2_integration.py::test_buy_credits_custom_amount

  edge:
    name: Edge Worker (TypeScript) tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Known vulnerabilities (npm audit)
        run: npm audit --audit-level=high --omit=dev

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
