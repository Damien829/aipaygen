<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="canonical" href="https://aipaygen.com/auth/login"><title>Sign In — AiPayGen</title>
<meta name="description" content="Sign in to AiPayGen with Google, GitHub, or email. Access your API keys, dashboard, and 250+ AI tools.">
<meta property="og:title" content="Sign In — AiPayGen">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0c10;color:#e8e8e8;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:#141820;border:1px solid #1e2530;border-radius:16px;padding:40px;max-width:420px;width:100%;text-align:center}
h1{font-size:1.5rem;margin-bottom:4px;color:#fff}
.sub{color:#8b949e;margin-bottom:24px;font-size:0.9rem}
.divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:#555;font-size:0.8rem}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:#2a2a2a}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #2a2a2a;background:#0d1117;color:#e8e8e8;font-size:1rem;margin-bottom:12px;outline:none}
input:focus{border-color:#6366f1}
.btn-primary{width:100%;padding:12px;border-radius:10px;border:none;background:#6366f1;color:#fff;font-size:0.95rem;font-weight:600;cursor:pointer;transition:background 0.2s}
.btn-primary:hover{background:#818cf8}
.btn-oauth{width:100%;padding:12px;border-radius:10px;border:1px solid #2a2a2a;background:#0d1117;color:#e8e8e8;font-size:0.95rem;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:10px;transition:all 0.2s;text-decoration:none}
.btn-oauth:hover{border-color:#555;background:#1e2530}
.btn-oauth svg{width:20px;height:20px;flex-shrink:0}
.msg{margin-top:16px;color:#34d399;display:none;font-size:0.9rem}
.error{margin-top:12px;color:#f87171;font-size:0.85rem;display:none}
.links{margin-top:20px;font-size:0.85rem;color:#8b949e}
.links a{color:#6366f1;text-decoration:none}
.links a:hover{text-decoration:underline}
</style>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4228277826827893" crossorigin="anonymous"></script>
</head><body>
<div class="card">
  <h1>Sign In</h1>
  <p class="sub">Access your API keys & dashboard</p>

  <!-- OAuth Buttons -->
  <a href="/sign-in/google" class="btn-oauth" id="btn-google">
    <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
    Continue with Google
  </a>
  <a href="/sign-in/github" class="btn-oauth" id="btn-github">
    <svg viewBox="0 0 24 24" fill="#fff"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
    Continue with GitHub
  </a>

  <div class="divider">or sign in with email</div>

  <!-- Magic Link Form -->
  <form id="f" onsubmit="return go()">
    <input id="email" type="email" placeholder="you@example.com" required autocomplete="email">
    <button type="submit" class="btn-primary">Send Magic Link</button>
  </form>
  <p class="msg" id="msg">Check your email for a sign-in link.</p>
  <p class="error" id="err"></p>

  <div class="links">
    <a href="/my-key">Recover API Key</a> &middot; <a href="/quick-key">Get Free Key</a> &middot; <a href="/">Home</a>
  </div>
</div>
<script>
async function go(){
  event.preventDefault();
  const err=document.getElementById('err');
  err.style.display='none';
  const email=document.getElementById('email').value;
  try{
    const r=await fetch('/auth/magic-link',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});
    if(r.ok){document.getElementById('msg').style.display='block';document.getElementById('f').style.display='none';}
    else{const d=await r.json();err.textContent=d.error||'Failed to send';err.style.display='block';}
  }catch(e){err.textContent='Network error';err.style.display='block';}
  return false;
}
// Show error from OAuth redirect
const params=new URLSearchParams(location.search);
if(params.get('error')){
  const err=document.getElementById('err');
  err.textContent='Sign-in failed: '+params.get('error').replace(/_/g,' ')+'. Please try again.';
  err.style.display='block';
}
</script></body></html>
