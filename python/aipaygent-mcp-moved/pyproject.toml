[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aipaygent-mcp"
version = "1.3.0"
description = "Moved: this package is now aipaygen-mcp. This final release forwards to it."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [{ name = "AIPayGen", email = "hello@aipaygen.com" }]
dependencies = ["aipaygen-mcp>=2.1.0"]
classifiers = ["Development Status :: 7 - Inactive"]

[project.urls]
Homepage = "https://aipaygen.com"
"New package" = "https://pypi.org/project/aipaygen-mcp/"

[project.scripts]
aipaygent-mcp = "aipaygent_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
