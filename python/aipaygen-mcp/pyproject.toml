[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aipaygen-mcp"
version = "2.1.0"
description = "AIPayGen MCP server for stdio clients: paid_fetch reads pages that charge AI agents (x402) from prepaid credit, no wallet; ai_terms checks a site's AI Terms; plus 100+ tools, most paid per call. No dependencies."
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [{ name = "AiPayGen", email = "hello@aipaygen.com" }]
keywords = ["mcp", "model-context-protocol", "mcp-server", "claude", "cursor", "ai-agents", "x402", "web-search", "crypto", "company-data"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: Name Service (DNS)",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://aipaygen.com"
Documentation = "https://aipaygen.com/docs"
Repository = "https://github.com/Damien829/aipaygen/tree/rebuild/python/aipaygen-mcp"

[project.scripts]
aipaygen-mcp = "aipaygen_mcp.bridge:main"

[tool.setuptools.packages.find]
where = ["src"]
