# Litestream: continuous backup of every AiPayGen SQLite database to Cloudflare R2.
# Each database streams its changes within about a second and keeps 7 days of
# history, so any moment in the last week can be restored (see deploy/README.md).
#
# Every database the code opens must be listed here; core/tests/test_backups_cover_all_dbs.py
# fails if one is missing. ${...} values come from deploy/.env.

snapshot:
  interval: 24h
  retention: 168h

dbs:
  - path: /data/a2a.db
    replica:
      type: s3
      bucket: ${R2_BUCKET}
      path: a2a
      endpoint: https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com
      region: auto
      access-key-id: ${R2_ACCESS_KEY_ID}
      secret-access-key: ${R2_SECRET_ACCESS_KEY}
  - path: /data/ab_tests.db
    replica:
      type: s3
